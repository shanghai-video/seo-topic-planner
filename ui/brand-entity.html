<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm brand entities</title>
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; background: Canvas; color: CanvasText; }
      main { max-width: 760px; margin: 0 auto; padding: 28px 22px 40px; }
      h1 { font-size: 22px; margin: 0 0 6px; }
      h2 { font-size: 15px; margin: 24px 0 8px; }
      p { line-height: 1.55; color: color-mix(in srgb, CanvasText 72%, Canvas); margin: 6px 0; }
      .lead { font-size: 14px; }
      .entity { border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
      .entity h3 { margin: 0 0 4px; font-size: 15px; }
      .meta { font-size: 13px; color: color-mix(in srgb, CanvasText 62%, Canvas); }
      .badge { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, CanvasText 12%, Canvas); margin-left: 6px; }
      .profiles { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
      button { appearance: none; border: 0; border-radius: 8px; padding: 10px 14px; background: #6d28d9; color: #fff; cursor: pointer; font: inherit; }
      button.secondary { background: color-mix(in srgb, CanvasText 12%, Canvas); color: CanvasText; }
      button:disabled { opacity: .55; cursor: wait; }
      .status { font-weight: 600; margin-top: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Confirm brand entities</h1>
      <p class="lead">The Planner separates the company, the brand, its products and related concepts. Confirm which entities are real and verify any external profile before it can be used as <code>sameAs</code>. Nothing here was fetched by the Planner itself.</p>

      <section id="existing"></section>
      <section id="suggested"></section>

      <div class="actions">
        <button id="confirm" type="button">Confirm entities</button>
        <button class="secondary" id="reload" type="button">Reload</button>
      </div>
      <div class="status" id="status">Ready.</div>
    </main>

    <script>
      let data = null;
      const els = {
        existing: document.querySelector('#existing'),
        suggested: document.querySelector('#suggested'),
        confirm: document.querySelector('#confirm'),
        reload: document.querySelector('#reload'),
        status: document.querySelector('#status'),
      };

      function readInitial() {
        const candidates = [
          window.openai && window.openai.toolOutput,
          window.openai && window.openai.toolResponseMetadata && window.openai.toolResponseMetadata.toolOutput,
          window.openai && window.openai.toolResponseMetadata && window.openai.toolResponseMetadata.structuredContent,
        ];
        for (const candidate of candidates) {
          if (candidate && typeof candidate === 'object' && (candidate.suggested_entities || candidate.entities)) {
            return candidate;
          }
        }
        return null;
      }
      function structured(output) {
        return (output && (output.structuredContent || output)) || {};
      }
      async function call(name, args) {
        return structured(await window.openai?.callTool?.(name, args || {}));
      }
      async function openCard(args) {
        return structured(await window.openai?.callTool?.('open_brand_entity_card', args || {}));
      }

      function entityCard(entity, suggested) {
        const wrap = document.createElement('div');
        wrap.className = 'entity';
        const title = document.createElement('h3');
        title.textContent = entity.canonical_name || entity.name || 'Unnamed entity';
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = entity.entity_type || 'brand';
        title.appendChild(badge);
        wrap.appendChild(title);
        if (entity.official_website) {
          const site = document.createElement('div');
          site.className = 'meta';
          site.textContent = entity.official_website;
          wrap.appendChild(site);
        }
        const profiles = (entity.verified_external_profiles || []).concat(
          suggested ? (entity.candidate_external_profiles || []) : []
        );
        if (profiles.length) {
          const list = document.createElement('ul');
          list.className = 'profiles';
          for (const profile of profiles) {
            const item = document.createElement('li');
            item.textContent = `${profile.profile_type || 'profile'}: ${profile.url}`;
            list.appendChild(item);
          }
          wrap.appendChild(list);
        }
        return wrap;
      }

      function render() {
        if (!data) return;
        els.existing.replaceChildren();
        els.suggested.replaceChildren();
        const existing = data.entities || [];
        const suggested = data.suggested_entities || [];
        if (existing.length) {
          const heading = document.createElement('h2');
          heading.textContent = 'Recorded entities';
          els.existing.appendChild(heading);
          existing.forEach((entity) => els.existing.appendChild(entityCard(entity, true)));
        }
        if (suggested.length) {
          const heading = document.createElement('h2');
          heading.textContent = 'Suggested entities (unconfirmed)';
          els.suggested.appendChild(heading);
          suggested.forEach((entity) => els.suggested.appendChild(entityCard(entity, true)));
        } else if (!existing.length) {
          const empty = document.createElement('p');
          empty.textContent = 'No entities were suggested. Ask the host agent to pass structured candidates.';
          els.suggested.appendChild(empty);
        }
      }

      async function confirmAll() {
        if (!data) return;
        els.confirm.disabled = true;
        els.status.textContent = 'Saving entities\u2026';
        try {
          const created = [];
          for (const entity of data.suggested_entities || []) {
            const result = await call('create_brand_entity', {
              workspace_id: data.workspace_id,
              brand_id: data.brand_id,
              canonical_name: entity.canonical_name,
              entity_type: entity.entity_type || 'brand',
              aliases: entity.aliases || [],
              official_website: entity.official_website || '',
            });
            if (result.brand_entity) created.push(result.brand_entity);
          }
          for (const entity of created) {
            await call('confirm_brand_entity', {
              workspace_id: data.workspace_id,
              entity_id: entity.id,
            });
          }
          els.status.textContent = `Confirmed ${created.length} entity(ies).`;
          data = await openCard({ workspace_id: data.workspace_id, brand_id: data.brand_id });
          render();
        } catch (error) {
          els.status.textContent = 'Could not confirm the entities. Please try again.';
        } finally {
          els.confirm.disabled = false;
        }
      }

      els.confirm.addEventListener('click', confirmAll);
      els.reload.addEventListener('click', async () => {
        if (!data) return;
        data = await openCard({ workspace_id: data.workspace_id, brand_id: data.brand_id });
        render();
      });
      window.addEventListener('message', (event) => {
        const incoming = event.data;
        if (incoming && typeof incoming === 'object' && (incoming.suggested_entities || incoming.entities)) {
          data = incoming;
          render();
        }
      });

      data = readInitial();
      if (data) {
        render();
      } else {
        data = { workspace_id: 'settings', entities: [], suggested_entities: [] };
        render();
        els.status.textContent = 'No entity candidates were received. Pass suggestions to open_brand_entity_card.';
      }
    </script>
  </body>
</html>
